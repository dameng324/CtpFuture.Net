name: Build and Package NuGet

on:
  workflow_call:
    inputs:
      version:
        description: Package version for manual publishing
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash
jobs:
  linux-build:
    runs-on: ubuntu-latest
    env:
      SWIG_DIR: src/CTPFutureApi
      PACKAGE_DIR: src/CTPFuture.Net
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Linux and SWIG build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates cmake curl gawk libpcre2-dev uchardet
          version="$(tr -d '\r\n' < .swig-version)"
          curl -fsSL --retry 3 "https://downloads.sourceforge.net/project/swig/swig/swig-${version}/swig-${version}.tar.gz" -o "$RUNNER_TEMP/swig.tar.gz"
          tar -xzf "$RUNNER_TEMP/swig.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/swig-${version}"
          ./configure --prefix=/usr/local
          make --jobs="$(nproc)"
          sudo make install
          actual_version="$(swig -version | awk '/SWIG Version/ {print $3; exit}')"
          if [[ "$actual_version" != "$version" ]]; then
            echo "Expected SWIG $version, got $actual_version" >&2
            exit 1
          fi
          swig -version

      - name: Generate SWIG bindings and build Linux native wrapper
        run: |
          set -euo pipefail
          dotnet tool restore
          pushd "$SWIG_DIR"
          bash ./SwigGenerate.sh
          if [[ -f ./linux-build.sh ]]; then
            bash ./linux-build.sh
          else
            echo 'This native SDK has no Linux library; skipping the Linux wrapper build.'
          fi
          popd

      - name: Bundle generated files for the Windows build
        run: |
          set -euo pipefail
          paths=("$PACKAGE_DIR/Swig" "$SWIG_DIR/swig_wrap.cxx" "$SWIG_DIR/swig_wrap.h")
          if [[ -f "$PACKAGE_DIR/ErrorMap.cs" ]]; then
            paths+=("$PACKAGE_DIR/ErrorMap.cs")
          fi
          if [[ -d "$PACKAGE_DIR/runtimes/linux-x64/native" ]]; then
            paths+=("$PACKAGE_DIR/runtimes/linux-x64/native")
          fi
          tar -czf "$RUNNER_TEMP/linux-swig-build.tar.gz" "${paths[@]}"

      - name: Upload generated SWIG files and Linux native library
        uses: actions/upload-artifact@v4
        with:
          name: linux-swig-build
          path: ${{ runner.temp }}/linux-swig-build.tar.gz
          if-no-files-found: error

  build:
    needs: linux-build
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download generated SWIG files and Linux native library
        uses: actions/download-artifact@v4
        with:
          name: linux-swig-build
          path: ${{ runner.temp }}/linux-swig-build

      - name: Extract generated SWIG files and Linux native library
        run: |
          set -euo pipefail
          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          runner_temp="$(cygpath -u "$RUNNER_TEMP")"
          tar -xzf "$runner_temp/linux-swig-build/linux-swig-build.tar.gz" -C "$workspace"

      - name: Determine publish version
        id: version
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
              echo 'Manual publishing must run from main.' >&2
              exit 1
            fi
            version="$MANUAL_VERSION"
          else
            git fetch origin main
            tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
            if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
              echo "Tag $GITHUB_REF is not based on main." >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          output_file="$(cygpath -u "$GITHUB_OUTPUT")"
          printf 'value=%s\n' "$version" >> "$output_file"

      - name: Build Windows native wrapper
        run: |
          set -euo pipefail
          cd src/CTPFutureApi
          bash ./win-build.sh

      - name: Check formatting
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet tool run csharpier check .

      - name: Restore dependencies
        run: dotnet restore CtpFuture.Net.slnx

      - name: Build solution
        run: dotnet build CtpFuture.Net.slnx --configuration Release --no-restore

      - name: Pack NuGet package
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          arguments=(pack src/CTPFuture.Net/CTPFuture.Net.csproj --configuration Release --no-restore --output ./packages)
          if [[ -n "$PACKAGE_VERSION" ]]; then
            arguments+=("-p:Version=$PACKAGE_VERSION")
          fi
          dotnet "${arguments[@]}"
      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./packages/*.nupkg
          if-no-files-found: error
          retention-days: 30
